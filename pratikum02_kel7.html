<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Pemesanan Barang</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f4;
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
            background: #fff;
            border: 1px solid #ccc;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
  
        .browser-bar {
            background: #ddd;
            padding: 5px 10px;
            border: 1px solid #bbb;
            margin-bottom: 20px;
            font-size: 12px;
        }
        .address-bar {
            background: #fff;
            padding: 3px 10px;
            border: 1px solid #999;
            margin-top: 5px;
        }
        .navbar {
            text-align: center;
            border-top: 1px solid #333;
            border-bottom: 1px solid #333;
            padding: 8px 0;
            margin-bottom: 20px;
            font-size: 14px;
        }
        .navbar a {
            text-decoration: none;
            color: #000;
            margin: 0 10px;
        }
        /* Form Layout */
        .form-row {
            display: flex;
            margin-bottom: 12px;
            align-items: flex-start;
        }
        .form-row label {
            width: 150px;
            font-weight: bold;
            font-size: 13px;
        }
        .form-row .input-content {
            flex: 1;
        }
        .image-box {
            width: 100px;
            height: 100px;
            border: 1px solid #000;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            background: #eaeaea;
            margin-right: 20px;
        }
        .image-box button {
            margin-top: 5px;
            font-size: 10px;
        }
        input[type="text"], select {
            width: 100%;
            padding: 5px;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }
        .note {
            font-size: 11px;
            color: #555;
            font-style: italic;
            margin-top: 2px;
        }
        .checkbox-group {
            margin-bottom: 12px;
            font-size: 13px;
        }
        .btn-submit {
            background-color: #008000;
            color: white;
            padding: 8px 20px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            display: block;
            margin: 20px auto 0 auto;
        }
        .btn-submit:hover {
            background-color: #006400;
        
    </style>
</head>
<body>

<div class="container">
    <!-- Mockup Browser Header -->
    <div class="browser-bar">
        <span>🌐 🔄 ❌ 🏠</span>
        <div class="address-bar">http://</div>
        <div style="text-align: right; font-weight: bold;">A Web Page</div>
    </div>

    <div class="navbar">
        <a href="#">Home</a> | 
        <a href="#">Generate Link</a> | 
        <a href="#">Transaction History</a> | 
        <a href="#">Policy</a> | 
        <a href="#">Logout</a>
    </div>

    <form id="orderForm" onsubmit="handleGenerateLink(event)">
        <div class="form-row">
            <div class="image-box">
                <span>[X]</span>
                <button type="button">Upload Picture</button>
            </div>
            <div class="input-content">
                <div style="margin-bottom: 8px;">
                    <label style="display:inline-block; width: 90px;">Title Here :</label>
                    <input type="text" value="MacBook Air £800" style="width: calc(100% - 100px); display:inline-block;">
                </div>
                <div style="margin-bottom: 8px;">
                    <label style="display:inline-block; width: 90px; vertical-align: top;">Description :</label>
                    <div style="display:inline-block; width: calc(100% - 100px);">
                        Year : 2009<br>
                        Model : <br>
                        Condition : Mint
                    </div>
                </div>
            </div>
        </div>

        <div class="form-row">
            <label>Account Number :</label>
            <div class="input-content">
                <input type="text" value="123-456-789-0">
            </div>
        </div>

        <div class="form-row">
            <label>Bank :</label>
            <div class="input-content">
                <select>
                    <option selected>HSBC</option>
                    <option>BCA</option>
                    <option>Mandiri</option>
                    <option>BNI</option>
                </select>
            </div>
        </div>

        <div class="form-row">
            <label>Account Holder :</label>
            <div class="input-content">
                <input type="text" value="Name Here">
            </div>
        </div>

        <div class="form-row">
            <label>Transaction :</label>
            <div class="input-content">
                <input type="text" value="1" style="width: 50px;">
                <div class="note">* If the transaction is for 3 person, choose 3 from the drop-down list</div>
            </div>
        </div>

        <div class="checkbox-group">
            <input type="checkbox" id="mobile" checked>
            <label for="mobile" style="font-weight: normal;">Send to Mobile Phone</label>
        </div>
        <div class="checkbox-group">
            <input type="checkbox" id="email" checked>
            <label for="email" style="font-weight: normal;">Send to Email</label>
        </div>

        <div class="form-row">
            <label>Send to Mobile Phone :</label>
            <div class="input-content">
                <input type="text" value="12345678910, 1234567891">
            </div>
        </div>

        <div class="form-row">
            <label>Send to Email :</label>
            <div class="input-content">
                <input type="text" value="infrm2g13@soton.ac.uk, fya_06@yahoo.com">
            </div>
        </div>

        <button type="submit" class="btn-submit">Generate Nblr Link</button>
    </form>
</div>

<script>
    function handleGenerateLink(event) {
        event.preventDefault();
        alert("Nblr Link berhasil di-generate!");
    }
</script>

</body>
</html>
